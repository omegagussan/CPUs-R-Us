name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate Code
        run: go generate ./...

      - name: Verify Code Drift
        run: git diff --exit-code

      - name: Fetch base branch for diffing
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Check Breaking API Changes (Product API)
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:api/product.yaml'
          revision: 'HEAD:api/product.yaml'

      - name: Check Breaking API Changes (Cart API)
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:api/cart.yaml'
          revision: 'HEAD:api/cart.yaml'

      - name: Build Binaries
        run: |
          go build -o product-api ./cmd/product-api
          go build -o cart-api ./cmd/cart-api

      - name: Run Tests
        run: go test -v ./...
