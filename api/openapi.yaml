openapi: 3.0.3

info:
  title: Product API
  description: API defining the operations available in the Product
  version: 0.1.0
#servers:
#  - url: "https://helloapi.apptocracy.com/v1"
#    description: Production API endpoint for the Hello World API

components:
  schemas:
    Error:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: integer
            format: int64
          message:
            type: string
    Message:
      type: object
      properties:
        message:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header
paths:
  /hello/{name}:
    get:
      operationId: sayHello
      description: say hello
      security:
        - ApiKeyAuth: []

      parameters:
        - name: name
          in: path
          required: true
          description: name of the individual to say hello to
          schema:
            type: string

      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
security:
  - ApiKeyAuth: []